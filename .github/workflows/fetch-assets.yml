name: Fetch wedding page assets
on:
  push:
    paths: [".github/workflows/fetch-assets.yml"]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download page source and images
        run: |
          set -e
          D=wedding-choreography/_src; mkdir -p $D
          B=https://www.choreonconcept.com/wp-content/uploads
          curl -fsSL -A "Mozilla/5.0" https://www.choreonconcept.com/best-wedding-choreography/ -o $D/page.html
          for f in 2020/11/Uncles-Performances.jpg 2020/11/Couple-dance-performance.jpg 2020/11/Solo-Dance-Performance.jpg 2020/11/First-dance-choreography.jpg 2020/11/All-Girls-Performances.jpg 2020/11/Family-Dance-Performances.jpg 2020/11/Couples-group-performances.jpg 2020/11/All_Girls_Performances.jpg 2020/11/Groom-and-bride-performance.jpg 2021/04/Weddding-Choreography-Ideas-1024x1024-1.jpg 2020/10/google.svg; do
            curl -fsSL -A "Mozilla/5.0" "$B/$f" -o "$D/$(basename $f)"
          done
          ls -la $D
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wedding-choreography/_src
          git diff --cached --quiet || git commit -m "Wedding page source and images (temporary)"
          git push
