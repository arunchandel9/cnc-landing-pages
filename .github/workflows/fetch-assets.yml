name: Fetch CNC assets
on:
  push:
    paths: [".github/workflows/fetch-assets.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download images from choreonconcept.com
        run: |
          set -e
          mkdir -p fees-timing/assets
          B=https://www.choreonconcept.com/wp-content/uploads
          dl(){ curl -fsSL -A "Mozilla/5.0" "$B/$1" -o "fees-timing/assets/$2"; }
          dl 2021/05/cropped-Choreo-N-Concept-Logo-2.png logo.png
          dl 2021/06/Choreo-N-Concept.jpg learn-from-basics.jpg
          dl 2021/06/4.jpg google-review.jpg
          dl 2020/11/lee-miller-47629-unsplash.jpg teach-bg.jpg
          ls -la fees-timing/assets
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fees-timing/assets
          git diff --cached --quiet || git commit -m "Add CNC landing page images"
          git push
